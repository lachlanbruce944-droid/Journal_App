# XcodeGen turns this file into Journal.xcodeproj (done automatically by the build workflow).
name: Journal
options:
  bundleIdPrefix: com.lachlanbruce
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Journal:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lachlanbruce.journal
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Journal
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: Your location is used to show local weather.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
